{% extends 'base.html' %}
{% set bare = true %}
{% block title %}ورود | دفترچه کارگاه{% endblock %}

{% block content %}
<div class="auth-wrap">
    <form class="auth-card" method="post">
        <h1><i class="fas fa-seedling"></i> دفترچه کارگاه</h1>
        <p>برای ادامه وارد شوید</p>
        {% if error %}<div class="alert">{{ error }}</div>{% endif %}
        <label class="field"><span>نام یا ایمیل</span>
            <input name="identifier" autocomplete="username" required autofocus></label>
        <label class="field"><span>رمز عبور</span>
            <input type="password" name="password" autocomplete="current-password" required></label>
        <button class="btn" type="submit">ورود</button>
        {% if allow_register %}<p style="margin-top: 12px"><a href="{{ url_for('signup.register') }}">حساب ندارید؟ ساخت حساب جدید</a></p>{% endif %}
    </form>
</div>
{% endblock %}
